<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>下ネタ診断！！</title>

<meta property="og:type" content="website">
<meta property="og:title" content="下ネタ診断！！">
<meta property="og:description" content="あなたの下ネタへの反応タイプ、バレます。友達と遊べるネタ心理テスト。">
<meta property="og:image" content="https://yaira-jun.github.io/yaira-shindan/og-image.png">
<meta property="og:url" content="https://yaira-jun.github.io/yaira-shindan/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="下ネタ診断！！">
<meta name="twitter:description" content="あなたの下ネタへの反応タイプ、バレます。友達と遊べるネタ心理テスト。">
<meta name="twitter:image" content="https://yaira-jun.github.io/yaira-shindan/og-image.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-decoration">
  <span class="float-emoji e1">😏</span>
  <span class="float-emoji e2">🔥</span>
  <span class="float-emoji e3">💭</span>
  <span class="float-emoji e4">🤭</span>
  <span class="float-emoji e5">❓</span>
  <span class="float-emoji e6">😳</span>
</div>

<main class="app">

  <!-- スタート画面 -->
  <section id="start-screen" class="screen active">
    <div class="card start-card">
      <p class="badge">友達と遊べるネタ心理テスト</p>
      <h1 class="title">下ネタ診断！！</h1>
      <p class="catch">あなたの下ネタへの反応タイプ、<br>バレます。</p>
      <p class="sub">全10問・所要時間 約1分</p>
      <div class="name-field">
        <label for="name-input">お名前(ニックネームでもOK)</label>
        <input type="text" id="name-input" maxlength="20" placeholder="例：ゆうき">
      </div>
      <button id="start-btn" class="btn btn-primary btn-large">診断スタート</button>
      <p class="disclaimer">※本サイトは下ネタへの「反応・ノリ」をネタとして診断するものです。過度に性的な内容は扱いません。</p>
    </div>
  </section>

  <!-- 診断画面 -->
  <section id="quiz-screen" class="screen">
    <div class="progress-wrap">
      <div class="progress-text" id="progress-text">Q1 / 10</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <div class="card quiz-card" id="quiz-card">
      <h2 class="question-text" id="question-text">質問文がここに入ります</h2>
      <div class="options" id="options-container"></div>
    </div>
  </section>

  <!-- 結果画面 -->
  <section id="result-screen" class="screen">
    <div class="card result-card">
      <p class="result-lead" id="result-lead">あなたの診断結果は……</p>
      <h2 class="result-title" id="result-title">診断結果</h2>
      <p class="result-desc" id="result-desc">説明文</p>

      <div class="gauge-wrap">
        <div class="gauge-label">
          <span>下ネタ反応度</span>
          <span id="gauge-percent">0%</span>
        </div>
        <div class="gauge-bar">
          <div class="gauge-fill" id="gauge-fill"></div>
        </div>
      </div>

      <div class="result-image-preview">
        <img id="result-image" alt="診断結果画像">
      </div>

      <div class="result-buttons">
        <button id="save-image-btn" class="btn btn-primary">画像を保存する</button>
        <div class="sns-row">
          <button id="sns-line-btn" class="btn btn-sns sns-line" type="button">LINEで送る</button>
          <button id="sns-x-btn" class="btn btn-sns sns-x" type="button">Xでポスト</button>
          <button id="sns-fb-btn" class="btn btn-sns sns-fb" type="button">Facebookでシェア</button>
        </div>
        <button id="copy-link-btn" class="btn btn-secondary">リンクをコピー</button>
        <button id="restart-btn" class="btn btn-secondary">もう一回やる</button>
      </div>
      <p class="copy-toast" id="copy-toast">結果をコピーしました！</p>
    </div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
